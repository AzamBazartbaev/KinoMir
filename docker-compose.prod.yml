name: kinomir-production

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinomir}
      POSTGRES_USER: ${POSTGRES_USER:-kinomir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; request = urllib.request.Request('http://localhost:8000/api/health/', headers={'Host': os.environ['DOMAIN'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /api
        NGINX_CONFIG: nginx.production.conf
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
      - edge

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    profiles: ["ops"]
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./ops/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - app

  alertmanager:
    build: ./ops/alertmanager
    restart: unless-stopped
    profiles: ["ops"]
    env_file:
      - ${ENV_FILE:-.env.production}
    volumes:
      - alertmanager_data:/alertmanager
    networks:
      - app

  prometheus:
    build: ./ops/prometheus
    restart: unless-stopped
    profiles: ["ops"]
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      backend:
        condition: service_healthy
      blackbox:
        condition: service_started
      alertmanager:
        condition: service_started
    volumes:
      - prometheus_data:/prometheus
    networks:
      - app

  backup:
    build: ./ops/backup
    restart: unless-stopped
    profiles: ["ops"]
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/media:ro
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:

networks:
  app:
    internal: true
  edge:
