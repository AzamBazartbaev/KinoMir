name: kinomir

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - backend_data:/app/data
      - media_data:/app/media
    environment:
      DJANGO_SEED_DEMO: ${DJANGO_SEED_DEMO:-true}
      REDIS_URL: redis://redis:6379/1
      DRF_NUM_PROXIES: "1"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: ${API_URL:-/api}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  media_data:
