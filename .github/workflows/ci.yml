name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kinomir_ci
          POSTGRES_USER: kinomir_ci
          POSTGRES_PASSWORD: kinomir-ci-password
        options: >-
          --health-cmd "pg_isready -U kinomir_ci -d kinomir_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-random-looking-characters-123
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      DJANGO_CORS_ALLOWED_ORIGINS: https://localhost
      DJANGO_SECURE_SSL_REDIRECT: "False"
      POSTGRES_DB: kinomir_ci
      POSTGRES_USER: kinomir_ci
      POSTGRES_PASSWORD: kinomir-ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Run Django deployment check
        run: python manage.py check --deploy --fail-level ERROR

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run Django tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check required frontend files
        run: test -s frontend/index.html && test -s frontend/styles.css && test -s frontend/nginx.conf

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)

  docker:
    name: Docker build
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: kinomir-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: kinomir-frontend:ci
          build-args: |
            API_URL=/api
            NGINX_CONFIG=nginx.production.conf

  e2e:
    name: Playwright E2E
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate E2E Compose configuration
        run: docker compose -f docker-compose.e2e.yml config --quiet

      - name: Run browser scenarios
        run: docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Upload Playwright report and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            e2e/reports/
            e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop E2E services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
